<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Качалка"><meta name="theme-color" content="#e9ebee">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Качалка</title>
<style>
:root{--bg:#e9ebee;--c:#f7f8f9;--t:#12161c;--m:#5b6572;--a:#1f4fd8;--g:#12805c;--l:#cfd4da}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1d2229;--t:#eef1f4;--m:#9aa4b2;--a:#6c8cff;--g:#3ecf8e;--l:#303743}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px calc(76px + env(safe-area-inset-bottom))}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin:10px 0}
.m{color:var(--m);font-size:14px}.up{color:var(--g);font-weight:600;font-size:14px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input,textarea{width:100%;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:10px;min-width:0}
input[type=number]{text-align:center}.row input:first-child{max-width:84px}
button,label.big{font:inherit;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:10px 14px;margin:6px 6px 0 0}
.big{display:block;text-align:center;width:100%;background:var(--a);color:#fff;border:0;font-weight:600;margin:8px 0 0}
.chip.on,nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--l)}
nav button{flex:1;margin:0}h1{font-size:22px;margin:14px 0 4px}
</style></head><body>
<div id="app"></div>
<nav><button data-t="today" onclick="tab='today';draw()">Сегодня</button><button data-t="hist" onclick="tab='hist';draw()">История</button><button data-t="data" onclick="tab='data';draw()">Данные</button></nav>
<script>
const P0=[
{id:'A',name:'Понедельник',ex:[
{n:'Выпады',w:13.5,t:[10,10,10]},
{n:'Жим на скамье',w:24,t:[15,15,14]},
{n:'Разведения',w:10,t:[12,12,12],lab:'10–12'},
{n:'Бицепс ладонью вверх',w:16,t:[12,12,12]},
{n:'Подъём ног',w:0,t:[15,13,12],u:'тело'}]},
{id:'B',name:'Пятница',ex:[
{n:'Гоублет-присед',w:24,t:[12,12,12],lab:'10–12'},
{n:'Жим над головой',w:16,t:[12,12,12],lab:'10–12, отдых 3 мин'},
{n:'Жим на полу',w:24,t:[15,15,15],lab:'12–15'},
{n:'Молот',w:16,t:[12,12,12]},
{n:'Тяга гантелей в наклоне',w:20.5,t:[12,12,12],lab:'10–12',u:'×2'}]}];
const K='wk1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{prog:P0,ses:[],bk:0};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);let day=null,tab='today';
let DR={};try{DR=JSON.parse(localStorage.getItem('wk1d'))||{}}catch(e){}
const dv=(k,d)=>(DR[day]&&DR[day][k]!=null)?DR[day][k]:d;
const sdr=()=>{try{localStorage.setItem('wk1d',JSON.stringify(DR))}catch(e){}};
document.addEventListener('input',e=>{const t=e.target;if(/^[wr]\d/.test(t.id)){(DR[day]=DR[day]||{})[t.id]=t.value;sdr()}});
const setv=(id,v)=>{const el=$('#'+id);if(el){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))}};
const last=n=>{for(let i=S.ses.length-1;i>=0;i--)if(S.ses[i].ex[n])return S.ses[i].ex[n]};
const hit=(e,x)=>x&&e.t.every((r,i)=>(x.r[i]||0)>=r);
function nextDay(){const l=S.ses[S.ses.length-1],ids=S.prog.map(d=>d.id);return l?ids[(ids.indexOf(l.day)+1)%ids.length]:ids[0]}
function today(){
 day=day||nextDay();const d=S.prog.find(x=>x.id==day)||S.prog[0];
 return `<h1>Сегодня</h1><div class=m>По очереди дальше: ${S.prog.find(x=>x.id==nextDay()).name}</div>`
 +S.prog.map(x=>`<button class="chip ${x.id==day?'on':''}" onclick="day='${x.id}';draw()">${x.name}</button>`).join('')
 +d.ex.map((e,i)=>{const l=last(e.n),w=l?l.w:e.w,bw=e.u=='тело';
 return `<div class=card><b>${e.n}</b> <span class=m>${e.lab||e.t.join(',')}${e.u&&!bw?', '+e.u:''}</span>
 ${l?`<div class=m>В прошлый раз: ${bw?'':l.w+(e.u=='×2'?'×2':'')+' кг × '}${l.r.join(',')}</div>`:''}
 ${hit(e,l)?'<div class=up>Цель закрыта: поднимай вес</div>':''}
 <div class=row>${bw?`<input id=w${i} type=hidden value=0>`:`<input id=w${i} type=number inputmode=decimal step=0.5 value="${dv('w'+i,w)}">`}
 ${e.t.map((r,j)=>`<input id=r${i}_${j} type=number inputmode=numeric placeholder="${r}" value="${dv('r'+i+'_'+j,'')}">`).join('')}</div></div>`}).join('')
 +`<button class=big onclick=fin()>Сохранить тренировку</button>
 <div class=card>Отдых: <button onclick=tm(90)>90 с</button><button onclick=tm(120)>2 мин</button><button onclick=tm(180)>3 мин</button><button onclick=tstop()>Стоп</button> <b id=tm></b></div>
 <details class=card><summary>Вставить результаты текстом</summary><textarea id=txt rows=6 placeholder="Гоблет-присед 24: 12,12,11"></textarea><button onclick=parse()>Разобрать в поля</button></details>`}
function fin(){const d=S.prog.find(x=>x.id==day),ex={};
 d.ex.forEach((e,i)=>{const r=e.t.map((_,j)=>+$(`#r${i}_${j}`).value||0);if(r.some(v=>v))ex[e.n]={w:+$(`#w${i}`).value||0,r}});
 if(!Object.keys(ex).length)return alert('Заполни хотя бы одно упражнение');
 S.ses.push({d:new Date().toISOString().slice(0,10),day,ex});save();delete DR[day];sdr();day=null;tab='hist';draw()}
const nm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/гоу/g,'го');
const cp=(a,b)=>{let i=0;while(i<a.length&&a[i]==b[i])i++;return i};
function parse(){const d=S.prog.find(x=>x.id==day);let n=0;
 $('#txt').value.split('\n').forEach(L=>{
 const m=L.match(/^(.*?)\s*(\d+(?:[.,]\d+)?)\s*(?:кг)?\s*(?:[×x*]\s*2)?\s*[:\-–]\s*([\d,\s]+)/i);if(!m)return;
 let bi=-1,bs=3;d.ex.forEach((e,i)=>{const s=cp(nm(e.n),nm(m[1]));if(s>bs){bs=s;bi=i}});if(bi<0)return;
 setv('w'+bi,m[2].replace(',','.'));
 m[3].split(/[,\s]+/).filter(Boolean).forEach((v,j)=>setv(`r${bi}_${j}`,v));n++});
 alert(n?'Разобрано упражнений: '+n:'Ничего не распознал. Формат: «Название вес: 12,12,12»')}
let tEnd=+localStorage.getItem('wk1t')||0,tI=0,wl=null,fired=false,ac;
const setT=v=>{tEnd=v;try{localStorage.setItem('wk1t',v)}catch(e){}};
function lock(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(e){}}
function beep(){try{if(ac){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);g.gain.value=.25;o.frequency.value=880;o.start();o.stop(ac.currentTime+.7)}}catch(e){}navigator.vibrate&&navigator.vibrate(300)}
function tick(){const el=$('#tm'),n=Date.now(),r=Math.ceil((tEnd-n)/1000);
 if(!tEnd){if(el)el.textContent='';return}
 if(r<=0){if(!fired){fired=true;if(n-tEnd<4000)beep();try{wl&&wl.release()}catch(e){}}
  clearInterval(tI);tI=0;if(n-tEnd>6e5){setT(0);if(el)el.textContent='';return}
  if(el)el.textContent='Пора!';return}
 if(el)el.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}
function tm(s){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
 setT(Date.now()+s*1000);fired=false;clearInterval(tI);tI=setInterval(tick,500);tick();lock()}
function tstop(){setT(0);clearInterval(tI);tI=0;tick()}
const back=()=>{tick();if(tEnd>Date.now()){if(!tI)tI=setInterval(tick,500);if(!wl)lock()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)back()});window.addEventListener('pageshow',back);
function hist(){return '<h1>История</h1>'+(S.ses.slice().reverse().map(s=>`<div class=card><b>${s.d}</b> <span class=m>${(S.prog.find(x=>x.id==s.day)||{}).name||s.day}</span>${Object.entries(s.ex).map(([n,x])=>`<div class=m>${n}: ${x.w?x.w+' кг × ':''}${x.r.join(',')}</div>`).join('')}<button onclick="del(${S.ses.indexOf(s)})">Удалить</button></div>`).join('')||'<div class=card>Пока пусто. Сохрани первую тренировку.</div>')}
function del(i){if(confirm('Удалить тренировку?')){S.ses.splice(i,1);save();draw()}}
function data(){const dd=S.bk?Math.floor((Date.now()-S.bk)/864e5):null;
 return `<h1>Данные</h1><div class=card>${dd===null?'Бэкапов ещё не было':'Последний бэкап: '+dd+' дн. назад'}${dd===null||dd>14?'<div class=up>Сделай бэкап: данные живут только в этом телефоне</div>':''}
 <button class=big onclick=exp()>Экспорт (в Яндекс Диск или Файлы)</button><label class=big>Импорт<input type=file accept=".json,application/json" hidden onchange=imp(this)></label></div>
 <div class=card><b>Программа (JSON)</b><div class=m>n: упражнение, w: вес, t: повторы для закрытия цели, lab: подпись, u: ×2 или тело</div><textarea id=pj rows=10>${JSON.stringify(S.prog)}</textarea><button onclick=sp()>Сохранить программу</button></div>`}
async function exp(){const f=new File([JSON.stringify(S,null,1)],'workouts-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else throw 0}
 catch(e){if(e&&e.name=='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
 S.bk=Date.now();save();draw()}
function imp(inp){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.ses||!o.prog)throw 0;S=o;save();draw();alert('Импортировано тренировок: '+o.ses.length)}catch(e){alert('Это не файл бэкапа')}};r.readAsText(inp.files[0])}
function sp(){try{const p=JSON.parse($('#pj').value);if(!Array.isArray(p))throw 0;S.prog=p;day=null;save();alert('Программа сохранена')}catch(e){alert('Некорректный JSON')}}
function draw(){$('#app').innerHTML=tab=='today'?today():tab=='hist'?hist():data();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));window.scrollTo(0,0);tick()}
draw();back();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
